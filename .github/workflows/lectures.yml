name: Lectures

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  decks:
    name: Decks match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Flakes and nix-command are on by default here, so no extra_nix_config.
      # The check has no npm dependency, so there is no install step.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop --command pnpm run check:lectures
