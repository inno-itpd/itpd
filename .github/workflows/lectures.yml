name: Lectures

on:
  pull_request:
  push:
    branches: [main]

permissions:
  # contents: read is the checkout, the only thing the job needs from the repo.
  # actions: write is what the cache purge calls for: it deletes caches through
  # the GitHub API, and a workflow that sets permissions grants nothing else.
  # The grant is scoped to this workflow, and the Markdown jobs stay read-only.
  contents: read
  actions: write

jobs:
  decks:
    name: Decks match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Flakes and nix-command are on by default here, so no extra_nix_config.
      # The check has no npm dependency, so there is no install step.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Cache nix store to speed up subsequent nix develop
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          gc-max-store-size-linux: 2G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or last accessed this duration (ISO 8601 duration format)
          # before the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: P1D
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never
      - run: nix develop --command pnpm run check:lectures
