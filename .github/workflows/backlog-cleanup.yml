name: Backlog cleanup

on:
  schedule:
    # Every Sunday at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: backlog-cleanup
  cancel-in-progress: false

permissions:
  # contents: write is the push of the cleanup branch, and pull-requests: write
  # is opening or refreshing its pull request. main is reached only through it.
  contents: write
  pull-requests: write

jobs:
  complete-done-tasks:
    name: Move Done tasks to completed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pin the CLI to the version the team uses locally, so the job moves
      # the tasks the same way a member's checkout would.
      - name: Install the Backlog CLI
        run: npm install --global --no-audit --no-fund backlog.md@1.52.0

      - name: Collect Done tasks
        id: collect
        run: |
          set -euo pipefail
          done_ids="$RUNNER_TEMP/done-task-ids.txt"
          : > "$done_ids"
          # check_active_branches is on, so the list can include a Done task
          # that exists only on another branch. Keep the ones on this checkout.
          backlog task list --status Done --json | jq -r '.tasks[].id' |
            while IFS= read -r task_id; do
              lower=$(printf '%s' "$task_id" | tr '[:upper:]' '[:lower:]')
              for file in "backlog/tasks/$lower - "*.md; do
                if [ -e "$file" ]; then
                  echo "$task_id" >> "$done_ids"
                fi
                break
              done
            done
          count=$(wc -l < "$done_ids" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Move Done tasks to completed
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          while IFS= read -r task_id; do
            backlog task complete "$task_id"
          done < "$RUNNER_TEMP/done-task-ids.txt"

      - name: Configure git
        if: steps.collect.outputs.count != '0'
        env:
          # A pull request opened with the repository GITHUB_TOKEN starts no
          # pull_request workflows, so a BACKLOG_CLEANUP_TOKEN secret, when set,
          # lets the pull request workflows run on it.
          GH_TOKEN: ${{ secrets.BACKLOG_CLEANUP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit the cleanup
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          branch="chore/backlog-weekly-completed"
          task_ids=$(paste -sd, "$RUNNER_TEMP/done-task-ids.txt" | sed 's/,/, /g')
          git checkout -b "$branch"
          git add backlog
          git commit -m "chore: move done tasks to completed" \
            -m "Move ${task_ids} from backlog/tasks/ to backlog/completed/ so the active task list holds only open work. The Backlog CLI changes the file location only; the task contents are unchanged."

      - name: Push the cleanup branch
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.BACKLOG_CLEANUP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          branch="chore/backlog-weekly-completed"
          # The branch belongs to this workflow, so force-with-lease refreshes
          # an unmerged cleanup pull request instead of failing or opening a
          # second one. The fetch gives the lease a remote-tracking ref.
          git fetch --quiet origin "$branch" || true
          git push --quiet --force-with-lease origin "$branch"

      - name: Open or refresh the cleanup pull request
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.BACKLOG_CLEANUP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          branch="chore/backlog-weekly-completed"
          task_ids=$(paste -sd, "$RUNNER_TEMP/done-task-ids.txt" | sed 's/,/, /g')
          body="$RUNNER_TEMP/cleanup-pr-body.md"
          cat > "$body" <<EOF
          ## Summary

          Move the Done tasks from \`backlog/tasks/\` to \`backlog/completed/\` so the active task list holds only open work.
          Generated by the scheduled \`Backlog cleanup\` workflow.

          ## Changes

          - Move ${task_ids} to \`backlog/completed/\` with \`backlog task complete\`; each task keeps its contents and changes location only.

          ## Definition of Done

          - [x] The change is confined to \`backlog/\`, which the Markdown check excludes.
          - [ ] CI is green.

          ## Reviewer notes

          Generated by \`.github/workflows/backlog-cleanup.yml\`.
          With the repository \`GITHUB_TOKEN\`, GitHub starts no pull request workflows for this pull request; set a \`BACKLOG_CLEANUP_TOKEN\` secret to have CI run on it.
          EOF
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$body"
            echo "Refreshed pull request #$number for $branch."
          else
            gh pr create --base main --head "$branch" --title "chore: move done tasks to completed" --body-file "$body"
          fi
